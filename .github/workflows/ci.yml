name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_ephemeral_password
          MYSQL_DATABASE: visual_studio_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Unit and MySQL transaction tests
        env:
          MYSQL_INTEGRATION: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: visual_studio_dev
          DB_USER: root
          DB_PASSWORD: ci_ephemeral_password
        run: npm test
      - name: Svelte static analysis
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Generate and verify independent SvelteKit application
        run: |
          npm run app:export -- --out "$RUNNER_TEMP/vas-standalone"
          cd "$RUNNER_TEMP/vas-standalone"
          npm install
          npm run verify:release
          npm test
          npm run check
          npm run build
          npm run deploy:stage -- --store "$RUNNER_TEMP/vas-release-store"
          RELEASE_ID=$(node -p "JSON.parse(require('fs').readFileSync('release.json','utf8')).releaseId")
          npm run deploy:promote -- --store "$RUNNER_TEMP/vas-release-store" --env local --release "$RELEASE_ID" --expect none --profile deployment/profiles/local.json
          npm run deploy:status -- --store "$RUNNER_TEMP/vas-release-store" --env local
